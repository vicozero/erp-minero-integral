# PLANTILLA — NO APLICADA
# Proxy inverso futuro para intranet autorizada. No se ha instalado nginx,
# abierto firewall ni publicado este servicio. Sustituir los marcadores antes
# de cualquier prueba controlada por el equipo de infraestructura.
#
# El backend FastAPI sigue escuchando solo en 127.0.0.1:8000. nginx sería el
# único proceso expuesto a la red interna y terminaría TLS.

server {
    listen 80;
    server_name erp-minero.intranet.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp-minero.intranet.example.invalid;

    # Rutas administradas por infraestructura. No versionar certificados.
    ssl_certificate     C:/nginx/certs/erp-minero-intranet.crt;
    ssl_certificate_key C:/nginx/certs/erp-minero-intranet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # React compilado. La ruta usa barras forward en configuración nginx/Windows.
    root E:/ERP_MINERO/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    # Cabeceras de seguridad. Equivalen a las del middleware de FastAPI y al
    # proxy local; no duplicarlas en la respuesta del backend.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; connect-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API y documentación: mismo origen, sin CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ~ ^/(health|health/db|status|openapi\.json|docs|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Adjuntos y rutas SPA: solo index.html, nunca listados de directorio.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log C:/nginx/logs/erp-minero-access.log;
    error_log  C:/nginx/logs/erp-minero-error.log warn;
}
