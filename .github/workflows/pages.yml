# Preparación de GitHub Pages: NO publica nada por sí solo.
#
# Antes de ejecutar este flujo se requiere, en este orden:
#   1. Autorizar la exposición pública (Puerta G7 del plan de despliegue).
#   2. Hacer público el repositorio (plan Free) o contratar un plan con Pages privado.
#   3. Configurar Settings -> Pages -> Source = GitHub Actions.
#   4. Definir VITE_API_URL con un backend HTTPS autorizado. Pages no sirve /api/v1.
#
# El flujo es manual a propósito: mientras no se ejecute, no hay sitio publicado.
name: Pages — preparado sin publicar

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar frontend para ruta de proyecto
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build con ruta base de GitHub Pages
        run: npm run build
        env:
          VITE_PUBLIC_BASE: /erp-minero-integral/
          # VITE_API_URL: https://backend-autorizado.example  # pendiente de definir

      - name: Verificar ruta base del artefacto
        run: grep -q '/erp-minero-integral/assets/' dist/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publicar artefacto (requiere Pages habilitado)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
