# GitHub Pages: demo estática del frontend.
#
# Estado: repo público (plan Free), Pages con source = GitHub Actions y sitio
# publicado en https://vicozero.github.io/erp-minero-integral/.
# El flujo sigue siendo manual: publicar una versión nueva requiere ejecutarlo
# explícitamente. Pages no sirve /api/v1; sin VITE_API_URL el sitio es una demo
# sin datos y el acceso no funciona.
name: GitHub Pages — demo estática

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar frontend para ruta de proyecto
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build con ruta base de GitHub Pages
        run: npm run build
        env:
          VITE_PUBLIC_BASE: /erp-minero-integral/
          # VITE_API_URL: https://backend-autorizado.example  # sólo con backend HTTPS autorizado

      - name: Verificar ruta base del artefacto
        run: grep -q '/erp-minero-integral/assets/' dist/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publicar artefacto en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
